<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Respawn Ranker</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505; 
      --text: #e0e0e0;
      --accent: #39ff14; 
      --secondary: #ff0055; 
      --cabinet: #1a1a1a;
      
      --glow-accent: 0 0 5px var(--accent), 0 0 15px var(--accent);
      --glow-secondary: 0 0 5px var(--secondary), 0 0 15px var(--secondary);
      --glow-text: 0 0 4px rgba(224, 224, 224, 0.6);
      --glow-box: 0 0 8px var(--accent), inset 0 0 8px var(--accent);
    }
    
    * { box-sizing: border-box; font-family: 'Press Start 2P', cursive; }
    
    body { 
      background-color: #0a0a0c; 
      background-image: radial-gradient(circle at center, #111 0%, #000 100%);
      margin: 0; padding: 0; 
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; text-transform: uppercase; overflow: hidden; 
    }

    .cabinet {
      background-color: var(--cabinet);
      width: 100%; max-width: 100%; height: 100vh; max-height: 100vh;
      padding: 20px 20px 30px 20px;
      box-shadow: inset 0 3px 5px rgba(255,255,255,0.1), inset 0 -5px 15px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; align-items: center; position: relative;
    }

    .crt-monitor {
      width: 100%; height: 100%; background-color: #000;
      border-radius: 30px 30px 30px 30px / 20px 20px 20px 20px; 
      border: 12px solid #050505; 
      box-shadow: inset 0 0 30px rgba(0,0,0,1), 0 0 15px rgba(57,255,20,0.15); 
      position: relative; overflow: hidden; 
    }

    .game-content {
      width: 100%; height: 100%; padding: 20px;
      overflow-y: auto; text-shadow: var(--glow-text); color: var(--text);
    }

    .crt-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px; pointer-events: none; z-index: 1000;
    }

    .crt-vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
      pointer-events: none; z-index: 999; box-shadow: inset 0 0 20px rgba(255,255,255,0.05); 
    }

    .scan-bar {
      width: 100%; height: 10px; background: rgba(57, 255, 20, 0.15);
      position: absolute; left: 0; animation: scanline 6s linear infinite;
      pointer-events: none; z-index: 1001; box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
    }

    @keyframes scanline { 0% { top: -10%; } 100% { top: 110%; } }
    
    .cabinet-details {
      display: flex; justify-content: space-between; align-items: center;
      width: 90%; max-width: 800px; margin-top: 20px;
    }

    .speaker-grille { display: flex; gap: 4px; }
    .speaker-hole {
      width: 6px; height: 15px; background-color: #050505; border-radius: 10px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05);
    }

    .cabinet-controls { display: flex; align-items: center; gap: 15px; }

    .power-led {
      width: 12px; height: 12px; background-color: #ff0000; border-radius: 50%;
      box-shadow: 0 0 10px #ff0000, inset 0 0 5px #fff;
    }

    .hardware-btn {
      background: #222; color: #888; border: 2px solid #111; border-radius: 50%;
      width: 32px; height: 32px; font-family: 'Press Start 2P'; font-size: 0.8rem;
      cursor: pointer; box-shadow: inset 0 2px 5px rgba(255,255,255,0.2), 0 2px 5px rgba(0,0,0,0.8);
      display: flex; justify-content: center; align-items: center;
    }
    .hardware-btn:active { box-shadow: inset 0 2px 10px rgba(0,0,0,0.8); color: var(--accent); }
    
    .game-header-logo {
      text-align: center;
      margin-bottom: 10px;
      position: relative;
      z-index: 1005; 
      width: 60%; 
      max-width: 250px; 
      display: block; 
      margin: 0 auto; 
    }

    .game-header-logo img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 0 5px var(--accent));
    }

    .subtitle {
      text-align: center; color: var(--secondary); font-size: 0.55rem; 
      text-shadow: var(--glow-secondary); letter-spacing: 1px; 
      margin-top: 20px; /* Added spacing from the logo */
      margin-bottom: 25px;
      line-height: 1.4;
    }
    
    .screen { 
      display: none; width: 100%; max-width: 600px; margin: 0 auto; 
      flex-direction: column; gap: 15px; 
    }
    
    .screen.active { display: flex; }
    
    .btn { 
      background-color: var(--bg); color: var(--text); border: 3px solid var(--text); 
      padding: 15px; font-size: 0.7rem; cursor: pointer; text-align: center; 
      transition: 0.2s; line-height: 1.4; text-shadow: var(--glow-text);
    }
    
    .btn:active { transform: translateY(2px); }
    .btn:hover { background-color: var(--text); color: var(--bg); text-shadow: none; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
    
    .btn-spin { border-color: var(--accent); color: var(--accent); text-shadow: var(--glow-accent); box-shadow: var(--glow-box); }
    .btn-spin:hover { background-color: var(--accent); color: var(--bg); text-shadow: none; box-shadow: 0 0 20px var(--accent); }
    
    .current-item-box { 
      background-color: var(--bg); color: var(--secondary); padding: 20px 10px; 
      border: 3px dashed var(--secondary); text-align: center; font-size: 1.1rem; 
      line-height: 1.5; margin-bottom: 10px; text-shadow: var(--glow-secondary);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3), inset 0 0 10px rgba(255, 0, 85, 0.3);
    }
    
    .slot { 
      display: flex; align-items: center; background-color: rgba(17, 17, 17, 0.7); 
      padding: 12px; margin-bottom: 10px; cursor: pointer; border: 3px solid #333; transition: 0.2s;
    }
    
    .slot:hover:not(.filled) { border-color: var(--accent); box-shadow: var(--glow-box); }
    .slot.filled { border-color: var(--text); background-color: rgba(34, 34, 34, 0.8); cursor: default; }
    
    .slot-number { font-size: 1.1rem; width: 35px; color: var(--accent); text-shadow: var(--glow-accent); }
    .slot-content { font-size: 0.7rem; flex-grow: 1; text-align: center; line-height: 1.4; }

    .modal {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10, 10, 10, 0.95); border: 4px solid var(--accent); padding: 25px;
      z-index: 2000; width: 85%; max-width: 400px; text-align: center; 
      box-shadow: 0 0 30px #000, 0 0 20px var(--accent);
    }
    .modal.active { display: flex; flex-direction: column; gap: 15px; }
    .modal h2 { color: var(--accent); font-size: 1rem; margin-top: 0; text-shadow: var(--glow-accent); }
    .modal p { font-size: 0.6rem; line-height: 1.8; color: #ccc; text-align: left; margin: 0;}

    .blink { animation: blinker 1s linear infinite; }
    @keyframes blinker { 50% { opacity: 0; } }
  </style>
</head>
<body>

  <div class="cabinet">
    <div class="crt-monitor">
      <div class="crt-overlay"></div>
      <div class="crt-vignette"></div>
      <div class="scan-bar"></div>

      <div id="help-modal" class="modal">
        <h2>HOW TO PLAY</h2>
        <p>1. SELECT CATEGORY.</p>
        <p>2. A RANDOM ITEM WILL APPEAR.</p>
        <p>3. RANK IT IN A SLOT (1-5).</p>
        <p>4. NO CHANGING ONCE PLACED!</p>
        <p>5. GET YOUR META SYNERGY SCORE.</p>
        <div style="height: 10px;"></div>
        <button id="install-btn" class="btn" style="display: none; border-color: var(--accent); color: var(--accent);" onclick="installApp()">INSTALL APP 💾</button>
        <button id="sound-toggle" class="btn btn-spin" onclick="toggleSound()">SOUND: ON 🔊</button>
        <button class="btn" style="border-color: var(--secondary); color: var(--secondary);" onclick="toggleModal()">CLOSE</button>
      </div>

      <div class="game-content">
        
        <div class="game-header-logo">
            <img src="images/logobanner.png" alt="Respawn Ranker Logo">
        </div>

        <div id="loading-screen" class="screen active">
          <h3 class="blink" style="text-align: center; font-size: 0.9rem; margin-top: 40px;">LOADING DATA...</h3>
        </div>

        <div id="home-screen" class="screen">
          <div class="subtitle">BLINDLY RANK YOUR TOP 5 AND GET YOUR META SYNERGY SCORE</div>
          <h3 style="text-align: center; color: #aaaaaa; font-size: 0.8rem; margin-top: 0;" id="sub-menu-title">SELECT CATEGORY</h3>
          <div id="category-buttons" style="display: flex; flex-direction: column; gap: 15px;"></div>
          <div style="height: 5px;"></div>
          <button class="btn btn-spin" id="spin-btn" onclick="spinWheel()">RNG CATEGORY</button>
        </div>

        <div id="game-screen" class="screen">
          <div style="text-align:center; color: #aaaaaa; font-size: 0.6rem; margin-top: 15px; margin-bottom: 15px;" id="category-label">CATEGORY</div>
          <div class="current-item-box" id="current-item">LOADING...</div>
          <div id="slots-container"></div>
        </div>
      </div>
    </div>

    <div class="cabinet-details">
      <div class="speaker-grille">
        <div class="speaker-hole"></div><div class="speaker-hole"></div><div class="speaker-hole"></div><div class="speaker-hole"></div><div class="speaker-hole"></div>
      </div>
      <div class="cabinet-controls">
        <button class="hardware-btn" onclick="toggleModal()">?</button>
        <div class="power-led"></div>
      </div>
    </div>
  </div>

  <script>
    let gameData = {};
    let activeItems = [];
    let currentItemIndex = 0;
    let rankedSlots = [null, null, null, null, null];
    let deferredPrompt; 

    let soundOn = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!soundOn) return;
      initAudio();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square'; 
      
      const now = audioCtx.currentTime;
      
      if (type === 'tick') {
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.02, now); 
        osc.start(now);
        osc.stop(now + 0.03); 
      } else if (type === 'bloop') {
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.1); 
        gain.gain.setValueAtTime(0.05, now);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(440, now); 
        osc.frequency.setValueAtTime(554.37, now + 0.1); 
        osc.frequency.setValueAtTime(659.25, now + 0.2); 
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.6); 
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('sound-toggle').innerText = soundOn ? "SOUND: ON 🔊" : "SOUND: OFF 🔇";
      if (soundOn) {
        initAudio();
        playSound('bloop');
      }
    }

    function toggleModal() {
      initAudio(); 
      const modal = document.getElementById('help-modal');
      modal.classList.toggle('active');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-btn').style.display = 'block';
    });

    async function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('App Installed');
        }
        deferredPrompt = null;
        document.getElementById('install-btn').style.display = 'none';
      }
    }

    window.addEventListener('appinstalled', () => {
      document.getElementById('install-btn').style.display = 'none';
      deferredPrompt = null;
    });

    function getMetaScore(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      return Math.abs(hash % 100); 
    }

    async function initApp() {
      try {
        const response = await fetch('database.json');
        if (!response.ok) throw new Error("Database load failed");
        gameData = await response.json();
        buildMainMenu();
        switchScreen('home-screen');
      } catch (error) {
        document.getElementById('loading-screen').innerHTML = `<h3 style="color:red; text-align:center; font-size: 0.8rem; text-shadow: 0 0 10px red; margin-top: 40px;">ERROR: DB NOT FOUND</h3>`;
      }
    }

    function buildMainMenu() {
      const container = document.getElementById('category-buttons');
      container.innerHTML = ''; 
      const categories = gameData["Video Games"];

      for (const category in categories) {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = category;
        btn.onclick = () => {
          playSound('bloop');
          startGame(category);
        };
        container.appendChild(btn);
      }
    }

    function spinWheel() {
      const btn = document.getElementById('spin-btn');
      const allCategories = Object.keys(gameData["Video Games"]);

      let spins = 0;
      const interval = setInterval(() => {
        playSound('tick');
        const randomCat = allCategories[spins % allCategories.length];
        btn.innerText = `...${randomCat.substring(0, 10)}...`;
        spins++;
        if (spins > 15) {
          clearInterval(interval);
          playSound('bloop');
          const finalCat = allCategories[Math.floor(Math.random() * allCategories.length)];
          startGame(finalCat);
        }
      }, 80);
    }

    function startGame(category) {
      initAudio();
      let dataPool = [...gameData["Video Games"][category]];
      if (dataPool.length < 5) return;

      activeItems = dataPool.sort(() => 0.5 - Math.random()).slice(0, 5);
      currentItemIndex = 0;
      rankedSlots = [null, null, null, null, null];
      
      document.getElementById('category-label').innerText = `RANKING: ${category}`;
      switchScreen('game-screen');
      updateGameUI();
    }

    function updateGameUI() {
      const container = document.getElementById('slots-container');
      container.innerHTML = '';
      const currentItemBox = document.getElementById('current-item');
      
      if (currentItemIndex >= 5) {
        playSound('win');
        let perfectOrder = [...rankedSlots].sort((a, b) => getMetaScore(b) - getMetaScore(a));
        let totalOffset = 0;
        
        rankedSlots.forEach((item, index) => {
          let perfectIndex = perfectOrder.indexOf(item);
          totalOffset += Math.abs(index - perfectIndex);
        });

        let score = Math.round(100 - ((totalOffset / 12) * 100));

        currentItemBox.innerHTML = `META SYNERGY:<br><span style="font-size:1.8rem; color: #fff; text-shadow: 0 0 10px #fff;">${score}%</span>`;
        currentItemBox.style.color = "var(--accent)";
        currentItemBox.style.borderColor = "var(--accent)";
        currentItemBox.style.boxShadow = "var(--glow-box)";
        currentItemBox.style.textShadow = "var(--glow-accent)";
        
        rankedSlots.forEach((item, i) => {
          container.innerHTML += `<div class="slot filled"><div class="slot-number">${i + 1}</div><div class="slot-content">${item}</div></div>`;
        });
        
        container.innerHTML += `<button class="btn btn-spin" style="width:100%; margin-top:15px;" onclick="resetGame()">INSERT COIN</button>`;
        
        document.querySelector('.game-content').scrollTop = document.querySelector('.game-content').scrollHeight;
        return;
      }
      
      currentItemBox.innerText = activeItems[currentItemIndex];
      currentItemBox.style.color = "var(--secondary)";
      currentItemBox.style.borderColor = "var(--secondary)";
      currentItemBox.style.boxShadow = "0 0 10px rgba(255, 0, 85, 0.3), inset 0 0 10px rgba(255, 0, 85, 0.3)";
      currentItemBox.style.textShadow = "var(--glow-secondary)";
      
      for (let i = 0; i < 5; i++) {
        const slotDiv = document.createElement('div');
        slotDiv.className = `slot ${rankedSlots[i] ? 'filled' : ''}`;
        slotDiv.innerHTML = `<div class="slot-number">${i + 1}</div><div class="slot-content">${rankedSlots[i] ? rankedSlots[i] : 'EMPTY'}</div>`;
        
        if (!rankedSlots[i]) slotDiv.onclick = () => {
          playSound('bloop');
          rankedSlots[i] = activeItems[currentItemIndex];
          currentItemIndex++;
          updateGameUI();
        };
        container.appendChild(slotDiv);
      }
    }

    function resetGame() {
      playSound('bloop');
      document.getElementById('spin-btn').innerText = "RNG CATEGORY";
      switchScreen('home-screen');
    }

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => console.log('SW Registered'));
    }

    initApp();
  </script>
</body>
</html>
