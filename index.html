<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Respawn Ranker</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505; /* Slightly off-black for the monitor base */
      --text: #e0e0e0;
      --accent: #39ff14; 
      --secondary: #ff0055; 
      --card: #111111;
      
      /* Glow Presets */
      --glow-accent: 0 0 5px var(--accent), 0 0 15px var(--accent);
      --glow-secondary: 0 0 5px var(--secondary), 0 0 15px var(--secondary);
      --glow-text: 0 0 4px rgba(224, 224, 224, 0.6);
      --glow-box: 0 0 8px var(--accent), inset 0 0 8px var(--accent);
    }
    
    * { 
      box-sizing: border-box; 
      font-family: 'Press Start 2P', cursive; 
    }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      margin: 0; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
      text-transform: uppercase;
      text-shadow: var(--glow-text);
      overflow-x: hidden;
    }

    /* --- CRT MONITOR OVERLAYS --- */
    .crt-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1000;
    }

    .crt-vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
      pointer-events: none;
      z-index: 999;
    }

    .scan-bar {
      width: 100%;
      height: 8px;
      background: rgba(57, 255, 20, 0.15);
      position: fixed;
      top: 0;
      left: 0;
      animation: scanline 8s linear infinite;
      pointer-events: none;
      z-index: 1001;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
    }

    @keyframes scanline {
      0% { transform: translateY(-100vh); }
      100% { transform: translateY(100vh); }
    }
    
    /* --- APP UI --- */
    h1 { 
      margin-top: 15px; 
      text-align: center; 
      font-size: 1.5rem;
      line-height: 1.5;
      color: var(--accent);
      text-shadow: var(--glow-accent);
      position: relative;
      z-index: 10;
    }
    
    .screen { 
      display: none; 
      width: 100%; 
      max-width: 450px; 
      flex-direction: column; 
      gap: 20px; 
      position: relative;
      z-index: 10;
    }
    
    .screen.active { 
      display: flex; 
    }
    
    .btn { 
      background-color: var(--bg); 
      color: var(--text); 
      border: 3px solid var(--text); 
      padding: 15px; 
      font-size: 0.8rem; 
      cursor: pointer; 
      text-align: center; 
      transition: 0.2s; 
      line-height: 1.4;
      text-shadow: var(--glow-text);
      box-shadow: 0 0 5px rgba(255,255,255,0.3);
    }
    
    .btn:active { 
      transform: translateY(4px); 
      box-shadow: none;
    }
    
    .btn:hover {
      background-color: var(--text);
      color: var(--bg);
      text-shadow: none;
      box-shadow: 0 0 15px rgba(255,255,255,0.6);
    }
    
    .btn-spin { 
      border-color: var(--accent); 
      color: var(--accent); 
      text-shadow: var(--glow-accent);
      box-shadow: var(--glow-box);
    }
    
    .btn-spin:hover {
      background-color: var(--accent);
      color: var(--bg);
      text-shadow: none;
      box-shadow: 0 0 20px var(--accent);
    }
    
    .current-item-box { 
      background-color: var(--bg); 
      color: var(--secondary); 
      padding: 25px 15px; 
      border: 3px dashed var(--secondary);
      text-align: center; 
      font-size: 1.2rem; 
      line-height: 1.5;
      margin-bottom: 20px; 
      text-shadow: var(--glow-secondary);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3), inset 0 0 10px rgba(255, 0, 85, 0.3);
    }
    
    .slot { 
      display: flex; 
      align-items: center; 
      background-color: rgba(17, 17, 17, 0.7); 
      padding: 15px; 
      margin-bottom: 15px; 
      cursor: pointer; 
      border: 3px solid #333; 
      transition: 0.2s;
    }
    
    .slot:hover:not(.filled) { 
      border-color: var(--accent); 
      box-shadow: var(--glow-box);
    }
    
    .slot.filled { 
      border-color: var(--text); 
      background-color: rgba(34, 34, 34, 0.8);
      cursor: default; 
      box-shadow: 0 0 5px rgba(255,255,255,0.2);
    }
    
    .slot-number { 
      font-size: 1.2rem; 
      width: 40px; 
      color: var(--accent); 
      text-shadow: var(--glow-accent);
    }
    
    .slot-content { 
      font-size: 0.8rem; 
      flex-grow: 1; 
      text-align: center; 
      line-height: 1.4;
    }

    .blink {
      animation: blinker 1s linear infinite;
    }

    @keyframes blinker {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>
  <div class="crt-vignette"></div>
  <div class="scan-bar"></div>

  <h1>RESPAWN RANKER</h1>

  <div id="loading-screen" class="screen active">
    <h3 class="blink" style="text-align: center; font-size: 1rem;">LOADING DATA...</h3>
  </div>

  <div id="menu-screen" class="screen">
    <h3 style="text-align: center; color: #aaaaaa; font-size: 0.9rem;">SELECT DOMAIN</h3>
    <div id="domain-buttons" style="display: flex; flex-direction: column; gap: 15px;"></div>
    <div style="height: 10px;"></div>
    <button class="btn btn-spin" id="spin-btn" onclick="spinWheel()">RNG ALL DATA</button>
  </div>

  <div id="sub-menu-screen" class="screen">
    <h3 style="text-align: center; color: #aaaaaa; font-size: 0.9rem;" id="sub-menu-title">SELECT CATEGORY</h3>
    <div id="sub-menu-buttons" style="display: flex; flex-direction: column; gap: 15px;"></div>
  </div>

  <div id="game-screen" class="screen">
    <div style="text-align:center; color: #aaaaaa; font-size: 0.7rem;" id="category-label">CATEGORY</div>
    <div class="current-item-box" id="current-item">LOADING...</div>
    <div id="slots-container"></div>
  </div>

  <script>
    let gameData = {};
    let activeItems = [];
    let currentItemIndex = 0;
    let rankedSlots = [null, null, null, null, null];

    function getMetaScore(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      return Math.abs(hash % 100); 
    }

    async function initApp() {
      try {
        const response = await fetch('database.json');
        if (!response.ok) throw new Error("Database load failed");
        gameData = await response.json();
        buildMainMenu();
        switchScreen('menu-screen');
      } catch (error) {
        document.getElementById('loading-screen').innerHTML = `<h3 style="color:red; text-align:center; font-size: 0.8rem; text-shadow: 0 0 10px red;">ERROR: DB NOT FOUND</h3>`;
      }
    }

    function buildMainMenu() {
      const container = document.getElementById('domain-buttons');
      container.innerHTML = '';
      
      for (const domain in gameData) {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = domain;
        btn.onclick = () => showSubMenu(domain);
        container.appendChild(btn);
      }
    }

    function showSubMenu(domain) {
      document.getElementById('sub-menu-title').innerText = `${domain}`;
      const container = document.getElementById('sub-menu-buttons');
      container.innerHTML = ''; 

      for (const category in gameData[domain]) {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = category;
        btn.onclick = () => startGame(domain, category);
        container.appendChild(btn);
      }

      const backBtn = document.createElement('button');
      backBtn.className = 'btn';
      backBtn.style.borderColor = '#555555';
      backBtn.style.color = '#555555';
      backBtn.style.boxShadow = 'none';
      backBtn.innerText = 'RETURN';
      backBtn.onclick = () => switchScreen('menu-screen');
      container.appendChild(backBtn);

      switchScreen('sub-menu-screen');
    }

    function spinWheel() {
      const btn = document.getElementById('spin-btn');
      let allCategories = [];
      for (const domain in gameData) {
        for (const cat in gameData[domain]) {
          allCategories.push({ domain, cat });
        }
      }

      let spins = 0;
      const interval = setInterval(() => {
        const randomTarget = allCategories[spins % allCategories.length];
        btn.innerText = `...${randomTarget.cat.substring(0, 10)}...`;
        spins++;
        if (spins > 15) {
          clearInterval(interval);
          const finalTarget = allCategories[Math.floor(Math.random() * allCategories.length)];
          startGame(finalTarget.domain, finalTarget.cat);
        }
      }, 100);
    }

    function startGame(domain, category) {
      let dataPool = [...gameData[domain][category]];
      if (dataPool.length < 5) return;

      activeItems = dataPool.sort(() => 0.5 - Math.random()).slice(0, 5);
      currentItemIndex = 0;
      rankedSlots = [null, null, null, null, null];
      
      document.getElementById('category-label').innerText = `RANKING: ${category}`;
      switchScreen('game-screen');
      updateGameUI();
    }

    function updateGameUI() {
      const container = document.getElementById('slots-container');
      container.innerHTML = '';
      const currentItemBox = document.getElementById('current-item');
      
      if (currentItemIndex >= 5) {
        let perfectOrder = [...rankedSlots].sort((a, b) => getMetaScore(b) - getMetaScore(a));
        let totalOffset = 0;
        
        rankedSlots.forEach((item, index) => {
          let perfectIndex = perfectOrder.indexOf(item);
          totalOffset += Math.abs(index - perfectIndex);
        });

        let score = Math.round(100 - ((totalOffset / 12) * 100));

        currentItemBox.innerHTML = `META SYNERGY:<br><span style="font-size:2rem; color: #fff; text-shadow: 0 0 10px #fff;">${score}%</span>`;
        currentItemBox.style.color = "var(--accent)";
        currentItemBox.style.borderColor = "var(--accent)";
        currentItemBox.style.boxShadow = "var(--glow-box)";
        currentItemBox.style.textShadow = "var(--glow-accent)";
        
        rankedSlots.forEach((item, i) => {
          container.innerHTML += `<div class="slot filled"><div class="slot-number">${i + 1}</div><div class="slot-content">${item}</div></div>`;
        });
        
        container.innerHTML += `<button class="btn btn-spin" style="width:100%; margin-top:20px;" onclick="resetGame()">INSERT COIN</button>`;
        return;
      }
      
      currentItemBox.innerText = activeItems[currentItemIndex];
      currentItemBox.style.color = "var(--secondary)";
      currentItemBox.style.borderColor = "var(--secondary)";
      currentItemBox.style.boxShadow = "0 0 10px rgba(255, 0, 85, 0.3), inset 0 0 10px rgba(255, 0, 85, 0.3)";
      currentItemBox.style.textShadow = "var(--glow-secondary)";
      
      for (let i = 0; i < 5; i++) {
        const slotDiv = document.createElement('div');
        slotDiv.className = `slot ${rankedSlots[i] ? 'filled' : ''}`;
        slotDiv.innerHTML = `<div class="slot-number">${i + 1}</div><div class="slot-content">${rankedSlots[i] ? rankedSlots[i] : 'EMPTY'}</div>`;
        
        if (!rankedSlots[i]) slotDiv.onclick = () => {
          rankedSlots[i] = activeItems[currentItemIndex];
          currentItemIndex++;
          updateGameUI();
        };
        container.appendChild(slotDiv);
      }
    }

    function resetGame() {
      document.getElementById('spin-btn').innerText = "RNG ALL DATA";
      switchScreen('menu-screen');
    }

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => console.log('SW Registered'));
    }

    initApp();
  </script>
</body>
</html>
